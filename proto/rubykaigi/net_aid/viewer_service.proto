syntax = "proto3";

package rubykaigi.net_aid;

import "rubykaigi/net_aid/viewer.proto";

option ruby_package = "Rk::NetAid";

// Tells a client who it is calling as.
service ViewerService {
  // Returns the party the request is made as.
  rpc GetViewer(ViewerServiceGetViewerRequest) returns (ViewerServiceGetViewerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Refreshes the session's himari tokens and roles. The only RPC that rewrites the session.
  //
  // Call it once after any RPC answers `session-expired`, then retry the calls that failed.
  // `session-revoked` means the session is cleared and the person signs in again.
  rpc RefreshSession(ViewerServiceRefreshSessionRequest) returns (ViewerServiceRefreshSessionResponse);
}

message ViewerServiceGetViewerRequest {}

message ViewerServiceGetViewerResponse {
  Viewer viewer = 1;
}

message ViewerServiceRefreshSessionRequest {}

message ViewerServiceRefreshSessionResponse {
  // The party the refreshed session is signed in as.
  Viewer viewer = 1;
}
