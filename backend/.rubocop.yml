inherit_gem:
  rubocop-shopify: rubocop.yml

plugins:
  - rubocop-factory_bot
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

Style/StringLiterals:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/WordArray:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  Enabled: false

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: false

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Style/ClassMethodsDefinitions:
  Enabled: false

Style/SingleLineMethods:
  Enabled: false

Style/InvertibleUnlessCondition:
  InverseMethods:
    # disable rubocop-rails rules depending on ActiveSupport methods
    :include?: ~
    :exclude?: ~

Style/AccessModifierDeclarations:
  Enabled: true
  EnforcedStyle: inline

Style/SpecialGlobalVars:
  Enabled: false

Style/CaseLikeIf:
  Enabled: true
  MinBranchesCount: 2

Style/EmptyCaseCondition:
  Enabled: false

Lint/NoReturnInBeginEndBlocks:
  Enabled: false

Layout/EndAlignment:
  EnforcedStyleAlignWith: start_of_line

Rails/FilePath:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

require:
  - ./rubocop/transaction_occ_awareness.rb
  - ./rubocop/changelog_bulk_write.rb
  - ./rubocop/net_http.rb

# Gems may use Net::HTTP; the app goes through HTTPX.
NetAid/NetHttp:
  Enabled: true

Dsql/TransactionOccAwareness:
  Enabled: true
  Exclude:
    - app/models/concerns/dsql_transactionable.rb

# Changelog::Context is the bulk path that records Changes.
Changelog/BulkWrite:
  Enabled: true
  Exclude:
    - app/models/changelog/context.rb

# Changelog::Context#insert_all! validates each row before its bulk insert.
Rails/SkipsModelValidations:
  Exclude:
    - app/models/changelog/context.rb

AllCops:
  SuggestExtensions: false
  Exclude:
    # buf output, checked as generated rather than linted.
    - gen/**/*
    - vendor/**/*

# Inline RBS signatures for Sorbet (`#:`, `#|`).
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
