<%
require_relative '../lib/dsql'
%>
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Local PostgreSQL from docker-compose.yml; DATABASE_URL takes over when set.
development: &development
  <<: *default
  database: netaid_development
<% docker_port = (ENV['DATABASE_URL'].nil? ? IO.popen([*%w(docker compose port db 5432), chdir: File.expand_path('..', __dir__), err: File::NULL], 'r', &:read).chomp.split(?:)&.last : nil) || '' %>
<% unless docker_port.empty? %>
  host: 127.0.0.1
  port: <%= docker_port %>
  username: netaid
  password: netaid
<% end %>

test:
  <<: *development
  database: netaid_test

# Aurora DSQL. Host, username and schema come from DATABASE_URL, e.g.
#   postgres://app_netaid@<id>.dsql.<region>.on.aws/postgres?schema_search_path=netaid_prd&aws_rds_iam_auth_token_generator=dsql
production:
  <<: *default
  database: postgres
  # DSQL closes a session after one hour. pool_jitter (default 0.2) spreads the actual deadline over 36-45 minutes.
  max_age: <%= ENV.fetch("RAILS_DB_MAX_AGE") { 45 * 60 } %>
  advisory_locks: false
  sslnegotiation: direct
  sslmode: verify-full
  sslrootcert: <%= Dsql.ssl_root_cert %> # AmazonRootCA1
